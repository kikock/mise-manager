[package]
name = "mise-manager"
version = "2.0.2"
description = "Windows 11 风格的 mise 版本管理器桌面应用"
authors = ["caokui <34462958@qq.com>"]
edition = "2021"

[lib]
name = "mise_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
which = "6.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
encoding_rs = "0.8"
winreg = "0.52"
