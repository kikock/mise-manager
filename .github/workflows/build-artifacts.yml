name: Build And Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '发布或更新的 Release Tag (默认 main)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          
          # 处理带 v 前缀的 tag 或 workflow_dispatch 自定义 target_tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target_tag }}" ]; then
            tag="${{ github.event.inputs.target_tag }}"
          else
            tag="${GITHUB_REF_NAME:-v$version}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "检测到版本号: $version (Tag: $tag)"

      - name: Validate tag matches package version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ steps.version.outputs.version }}"
          pushed_tag="${{ github.ref_name }}"
          # 允许 v1.0.0 或 1.0.0
          clean_tag="${pushed_tag#v}"

          if [[ "$clean_tag" != "$expected_version" ]]; then
            echo "❌ 推送的 tag ($pushed_tag) 与 package.json 版本 ($expected_version) 不一致"
            exit 1
          fi
          echo "✅ Tag 与 package.json 版本匹配一致: $pushed_tag"

  create-release:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          title="mise-manager v${APP_VERSION}"

          # 读取标准模版并替换版本号，彻底避免 YAML 缩进解析问题
          sed "s/__VERSION__/${APP_VERSION}/g" .github/release-template.md > release_notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，执行更新说明文档..."
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --draft=false \
              --prerelease=false
          else
            echo "创建新的 Release $RELEASE_TAG ..."
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi

          # 若当前发布的不是 main，但存在 tag 叫 main 的 Release，同步更新其说明页面
          if [ "$RELEASE_TAG" != "main" ] && gh release view "main" >/dev/null 2>&1; then
            echo "同步美化更新 main Release 页面说明..."
            gh release edit "main" --title "$title" --notes-file release_notes.md || true
          fi

  release-windows:
    needs:
      - prepare-version
      - create-release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Application (Windows NSIS)
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        run: yarn build --publish never

      - name: Validate Windows Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = @(
            'dist/latest.yml',
            'dist/mise-manager-setup-*.exe',
            'dist/mise-manager-setup-*.exe.blockmap'
          )

          foreach ($pattern in $patterns) {
            $items = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            if (-not $items) {
              throw "❌ 构建校验失败，未找到目标文件: $pattern"
            }
            Write-Host "✅ 验证通过: $($items.FullName)"
          }

      - name: Upload Windows Assets to Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem 'dist/latest.yml' | Select-Object -ExpandProperty FullName
            Get-ChildItem 'dist/mise-manager-setup-*.exe' | Select-Object -ExpandProperty FullName
            Get-ChildItem 'dist/mise-manager-setup-*.exe.blockmap' | Select-Object -ExpandProperty FullName
          )

          Write-Host "正在上传 Windows 构建产物到 Release: $env:RELEASE_TAG"
          gh release upload $env:RELEASE_TAG @files --clobber
          Write-Host "🎉 上传成功完成！"
