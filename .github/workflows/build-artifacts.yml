name: Build And Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '发布或更新的 Release Tag (默认 main)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          
          # 处理带 v 前缀的 tag 或 workflow_dispatch 自定义 target_tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target_tag }}" ]; then
            tag="${{ github.event.inputs.target_tag }}"
          else
            tag="${GITHUB_REF_NAME:-v$version}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "检测到版本号: $version (Tag: $tag)"

      - name: Validate tag matches package version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ steps.version.outputs.version }}"
          pushed_tag="${{ github.ref_name }}"
          # 允许 v1.0.0 或 1.0.0
          clean_tag="${pushed_tag#v}"

          if [[ "$clean_tag" != "$expected_version" ]]; then
            echo "❌ 推送的 tag ($pushed_tag) 与 package.json 版本 ($expected_version) 不一致"
            exit 1
          fi
          echo "✅ Tag 与 package.json 版本匹配一致: $pushed_tag"

  create-release:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          title="mise-manager v${APP_VERSION}"

          # 生成标准精美的 GitHub Release Markdown 说明（避免 \n 转义乱码）
          cat << 'EOF' > release_notes_template.md
# 🚀 mise-manager v__VERSION__ 正式发布

> **Mise Manager** 是一款专为 Windows 11 设计的现代化 Fluent Design 开发环境与工具版本管理器。基于 `mise` 核心运行时，提供多版本自由切换、官方应用生态市场、绿色目录管理与环境变量一键注入。

---

### ✨ 核心功能亮点

- 🎨 **Windows 11 Fluent 视觉美学**：采用原生毛玻璃（Mica）质感与现代控件，完美支持**深色 / 浅色 / 跟随系统**一键无缝切换。
- ⚡ **零白屏秒开引擎**：集成 SWR 快照瞬时呈现与本地原生进程调度，优化启动链路，打开即用、流畅丝滑。
- 📦 **工具多版本全量管理**：全量扫描已安装的开发工具（Node.js、Python、Go、Rust、Java 等），支持多版本共存与一键激活 (`mise use`)。
- 🏪 **官方应用生态市场**：无缝对接官方 `mise-versions` 全量数据，支持分页拉取、离线持久化缓存与关键词毫秒级搜索。
- ⚙️ **统一绿色架构与环境注入**：支持自定义主目录（`MISE_DATA_DIR`），自动管理 `shims` 与 `bin`，一键注入系统环境变量 `PATH`，卸载无残留。
- 🔍 **客户端在线升级检测**：内置自动化版本检测通道，直通 GitHub Release，第一时间获取最新更新。

---

### 📥 资产安装指南

| 安装程序 | 适用系统 | 架构 | 说明 |
| :--- | :--- | :--- | :--- |
| **`mise-manager-setup-__VERSION__.exe`** | Windows 10 / 11 | `x64` | 官方安装向导（支持自定义安装路径） |

#### 快速开始：
1. 下载下方 Assets 中的 **`mise-manager-setup-__VERSION__.exe`**；
2. 运行安装程序，按提示完成安装并启动；
3. 首次启动可在首页点击 **“立即安装 mise”** 一键初始化开发环境！

---

### 🔗 相关链接
- 📖 **项目主页**：[kikock/mise-manager](https://github.com/kikock/mise-manager)
- 🐛 **问题反馈**：[提交 Issue](https://github.com/kikock/mise-manager/issues)
- 🌐 **mise 官方文档**：[https://mise.jdx.dev](https://mise.jdx.dev)
EOF

          sed "s/__VERSION__/${APP_VERSION}/g" release_notes_template.md > release_notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，执行更新说明文档..."
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --draft=false \
              --prerelease=false
          else
            echo "创建新的 Release $RELEASE_TAG ..."
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi

          # 若当前发布的不是 main，但存在 tag 叫 main 的 Release，同步更新其说明页面
          if [ "$RELEASE_TAG" != "main" ] && gh release view "main" >/dev/null 2>&1; then
            echo "同步美化更新 main Release 页面说明..."
            gh release edit "main" --title "$title" --notes-file release_notes.md || true
          fi

  release-windows:
    needs:
      - prepare-version
      - create-release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Application (Windows NSIS)
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        run: yarn build --publish never

      - name: Validate Windows Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = @(
            'dist/latest.yml',
            'dist/mise-manager-setup-*.exe',
            'dist/mise-manager-setup-*.exe.blockmap'
          )

          foreach ($pattern in $patterns) {
            $items = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            if (-not $items) {
              throw "❌ 构建校验失败，未找到目标文件: $pattern"
            }
            Write-Host "✅ 验证通过: $($items.FullName)"
          }

      - name: Upload Windows Assets to Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem 'dist/latest.yml' | Select-Object -ExpandProperty FullName
            Get-ChildItem 'dist/mise-manager-setup-*.exe' | Select-Object -ExpandProperty FullName
            Get-ChildItem 'dist/mise-manager-setup-*.exe.blockmap' | Select-Object -ExpandProperty FullName
          )

          Write-Host "正在上传 Windows 构建产物到 Release: $env:RELEASE_TAG"
          gh release upload $env:RELEASE_TAG @files --clobber
          Write-Host "🎉 上传成功完成！"
