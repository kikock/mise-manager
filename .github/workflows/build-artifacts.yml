name: Build And Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '发布或更新的 Release Tag (默认 main)'
        required: false
        default: 'main'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target_tag }}" ]; then
            tag="${{ github.event.inputs.target_tag }}"
          else
            tag="${GITHUB_REF_NAME:-v$version}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "检测到版本号: $version (Tag: $tag)"

  create-release:
    needs: prepare-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          title="mise-manager v${APP_VERSION} (Tauri 2.x 原生架构)"
          sed "s/__VERSION__/${APP_VERSION}/g" .github/release-template.md > release_notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，更新说明..."
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --draft=false \
              --prerelease=false
          else
            echo "创建新的 Release $RELEASE_TAG ..."
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi

          if [ "$RELEASE_TAG" != "main" ] && gh release view "main" >/dev/null 2>&1; then
            echo "同步更新 main Release 页面说明..."
            gh release edit "main" --title "$title" --notes-file release_notes.md || true
          fi

  release-windows:
    needs:
      - prepare-version
      - create-release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm ci

      - name: Check Standards & Build Web Assets
        run: npm run build

      # 1. 构建轻量标准版（使用系统 WebView2，安装包极轻量）
      - name: Build Standard Lightweight Package (Tauri 2.x)
        run: npm run tauri build

      # 2. 下载微软官方 WebView2 离线安装包并构建内嵌离线完整版
      - name: Download WebView2 Standalone Installer
        shell: pwsh
        run: |
          Write-Host "开始从微软官方永久重定向链接下载 WebView2 Standalone 离线安装器 (x64)..."
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://go.microsoft.com/fwlink/?linkid=2124701"
          $dest = "src-tauri/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRedirection 10
          if (Test-Path $dest) {
            $bytes = (Get-Item $dest).Length
            Write-Host "✅ 离线安装包下载完成: $bytes 字节 ($([math]::Round($bytes / 1MB, 2)) MB)"
            if ($bytes -lt 50000000) {
              throw "❌ 离线安装包大小异常 (<50MB)，可能下载不完整"
            }
          } else {
            throw "❌ 离线安装包下载失败"
          }

      - name: Build Full Offline Package (Embedded WebView2)
        run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json

      - name: Collect and Rename Artifacts
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release_artifacts"

          # 收集轻量标准版
          $stdNsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/mise-manager_*_x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($stdNsis) {
            Copy-Item $stdNsis.FullName "release_artifacts/mise-manager-setup-$ver-x64.exe" -Force
          }
          $stdMsi = Get-ChildItem "src-tauri/target/release/bundle/msi/mise-manager_*_x64_*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($stdMsi) {
            Copy-Item $stdMsi.FullName "release_artifacts/mise-manager-$ver-x64.msi" -Force
          }

          # 收集内嵌离线完整版
          $offlineNsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/mise-manager-full-offline_*_x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($offlineNsis) {
            Copy-Item $offlineNsis.FullName "release_artifacts/mise-manager-setup-$ver-full-offline-x64.exe" -Force
          }

          # 收集免安装独立 exe 并压缩为 zip
          $rawExe = "src-tauri/target/release/mise-manager.exe"
          if (Test-Path $rawExe) {
            Copy-Item $rawExe "release_artifacts/mise-manager-portable-$ver-x64.exe" -Force
            Compress-Archive -Path $rawExe -DestinationPath "release_artifacts/mise-manager-$ver-win-x64.zip" -Force
          }

          Get-ChildItem "release_artifacts" | Format-Table Name, Length

      - name: Upload Windows Assets to Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
        shell: pwsh
        run: |
          $files = Get-ChildItem "release_artifacts/*" | Select-Object -ExpandProperty FullName
          Write-Host "上传构建产物至 Release: $env:RELEASE_TAG"
          gh release upload $env:RELEASE_TAG @files --clobber
          Write-Host "🎉 双轨版本产物全部上传成功！"
